{% extends 'admin/layout.html' %}
{% block page_title %}Publish Blog{% endblock %}
{% block admin_content %}
<section class="admin-panel">
    <div class="admin-panel-header">
        <div>
            <h2><i class="fa-solid fa-pen-nib"></i> Publish Blog</h2>
            <p>Create editorial content for the store blog.</p>
        </div>
    </div>
    <div class="admin-panel-body">
        <form method="POST" action="/admin/add_blog" enctype="multipart/form-data" class="admin-form">
            <div class="form-group">
                <label class="form-label">Blog Title</label>
                <input type="text" name="title" class="form-control" placeholder="Article headline" required>
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="Travel">Travel</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Technology">Technology</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Food & Cooking">Food & Cooking</option>
                    <option value="Health & Fitness">Health & Fitness</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Business">Business</option>
                    <option value="Education">Education</option>
                    <option value="Art & Culture">Art & Culture</option>
                    <option value="Gaming">Gaming</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Content</label>
                <textarea name="content" class="form-control" rows="8" placeholder="Write the article body..." required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Cover Image</label>
                <input type="file" name="blog_image" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-success"><i class="fa-solid fa-paper-plane"></i> Publish Article</button>
        </form>
    </div>
</section>
{% endblock %}
