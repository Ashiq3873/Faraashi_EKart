{% extends 'admin/layout.html' %}
{% block page_title %}Add Product{% endblock %}
{% block admin_content %}
<section class="admin-panel">
    <div class="admin-panel-header">
        <div>
            <h2><i class="fa-solid fa-circle-plus"></i> Add Product</h2>
            <p>Register a new item in the product catalog.</p>
        </div>
    </div>
    <div class="admin-panel-body">
        <form method="POST" action="/admin/add_product" enctype="multipart/form-data" class="admin-form">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter product name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Food">Food</option>
                        <option value="Watch">Watch</option>
                        <option value="Toys">Toys</option>
                        <option value="Dress">Dress</option>
                        <option value="Cosmetics">Cosmetics</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Jewelry">Jewelry</option>
                        <option value="Footwear">Footwear</option>
                        <option value="Home & Living">Home & Living</option>
                        <option value="Sports">Sports</option>
                        <option value="Books">Books</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Selling Price (₹)</label>
                    <input type="number" name="price" class="form-control" placeholder="0.00" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Compare Price (₹)</label>
                    <input type="number" name="compare_price" class="form-control" placeholder="Optional" min="0" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Product description for the storefront" required></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Initial Stock</label>
                    <input type="number" name="stock" class="form-control" value="10" min="0" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Product Media (Images & Videos)</label>
                    <input type="file" name="media" class="form-control" accept="image/*,video/*" multiple>
                </div>
            </div>
            <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Save Product</button>
        </form>
    </div>
</section>
{% endblock %}
